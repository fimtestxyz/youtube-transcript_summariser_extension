<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="0.55" stop-color="#e60000"/>
      <stop offset="1" stop-color="#b30000"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.22" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="128" height="128" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- background -->
    <rect x="0" y="0" width="128" height="128" fill="url(#bg)"/>
    <rect x="0" y="0" width="128" height="128" fill="url(#sheen)"/>

    <!-- transcript bars (bolder) -->
    <rect x="14" y="42" width="48" height="12" rx="6" fill="#ffffff"/>
    <rect x="14" y="58" width="56" height="12" rx="6" fill="#ffffff"/>
    <rect x="14" y="74" width="38" height="12" rx="6" fill="#ffffff"/>

    <!-- play triangle (solid, no stroke) -->
    <path d="M76 30 L118 64 L76 98 Z" fill="#ffffff"/>
  </g>

  <!-- sparkle (AI), top-right -->
  <path d="M103 10 C106 21.4 112 26 118.6 28 C112 30 106 34.6 103 46 C100 34.6 94 30 87.4 28 C94 26 100 21.4 103 10 Z"
        fill="url(#spark)"/>
</svg>
